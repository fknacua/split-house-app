name: Restore

# Loads a backup from the R2 bucket into an empty database given by the RESTORE_TARGET_URL secret,
# then reports row counts against production and checks each stored bill PDF opens.
# Used for restore tests and for a real restore. Steps: backend/README.md, "Backups and restore".
on:
  workflow_dispatch:
    inputs:
      backup:
        description: "Backup file name, for example split-house-2026-11-27T084736Z.dump.gpg (leave empty for the newest)"
        required: false
        default: ""

concurrency:
  group: restore
  cancel-in-progress: false

# The job reads no repository content.
permissions: {}

defaults:
  run:
    # Explicit bash so every step runs with -e and pipefail.
    shell: bash

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Must be at least the server's major version (Neon runs Postgres 18).
      PG_MAJOR: "18"
      PREFIX: db/
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
      # R2 needs a region value but ignores it.
      AWS_DEFAULT_REGION: auto
      BACKUP_ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
      BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
      # The free database may be asleep; give it time to wake.
      PGCONNECT_TIMEOUT: "60"
    steps:
      - name: Check the secrets are set
        env:
          RESTORE_TARGET_URL: ${{ secrets.RESTORE_TARGET_URL }}
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=0
          for name in RESTORE_TARGET_URL NEON_DIRECT_URL BACKUP_PASSPHRASE BACKUP_BUCKET BACKUP_ENDPOINT AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is empty or missing."
              missing=1
            fi
          done
          exit "$missing"

      # Same install as backup.yml, plus poppler-utils for pdfinfo.
      - name: Install the Postgres client and pdfinfo
        run: |
          keyring=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o "$keyring" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          # Stop unless the key is the PostgreSQL signing key.
          key_info=$(gpg --show-keys --with-colons "$keyring")
          grep -q '^fpr:::::::::B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8:$' <<< "$key_info"
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: %s\n' \
            "$VERSION_CODENAME" "$keyring" | sudo tee /etc/apt/sources.list.d/pgdg.sources > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR" poppler-utils > /dev/null
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          pg_restore --version
          pdfinfo -v 2>&1 | head -n 1
          aws --version

      # Two guards so this can never write over live data.
      - name: Check the target is safe
        env:
          RESTORE_TARGET_URL: ${{ secrets.RESTORE_TARGET_URL }}
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          # Host (pooled or direct) and database name, so the same database matches either way.
          where() {
            python3 -c 'import sys, urllib.parse as u; p = u.urlparse(sys.argv[1]); print((p.hostname or "").replace("-pooler", "") + "/" + p.path.lstrip("/"))' "$1"
          }
          if [ "$(where "$RESTORE_TARGET_URL")" = "$(where "$NEON_DIRECT_URL")" ]; then
            echo "::error::RESTORE_TARGET_URL points at the production database. Restore into a new, empty database instead."
            exit 1
          fi
          tables=$(psql -X -q -t -A -v ON_ERROR_STOP=1 --dbname="$RESTORE_TARGET_URL" \
            -c "select count(*) from pg_tables where schemaname = 'public'")
          if [ "$tables" != "0" ]; then
            echo "::error::The target database already has $tables tables. Restore only into a new, empty database."
            exit 1
          fi
          echo "Target is not production and has no tables."

      - name: Download and decrypt
        env:
          BACKUP_INPUT: ${{ inputs.backup }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          umask 077
          if [ -n "$BACKUP_INPUT" ]; then
            name="${BACKUP_INPUT#"$PREFIX"}"
            if ! [[ "$name" =~ ^split-house-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{6}Z\.dump\.gpg$ ]]; then
              echo "::error::Not a backup file name: expected split-house-YYYY-MM-DDTHHMMSSZ.dump.gpg"
              exit 1
            fi
          else
            # Names start with a UTC timestamp, so the last in name order is the newest.
            listing=$(aws s3api list-objects-v2 --bucket "$BACKUP_BUCKET" --prefix "$PREFIX" \
              --endpoint-url "$BACKUP_ENDPOINT" --query 'Contents[].Key' --output text)
            key=$(tr '\t' '\n' <<< "$listing" | grep -v -e '^None$' -e '^$' | sort | tail -n 1)
            if [ -z "$key" ]; then
              echo "::error::No backups found in the bucket."
              exit 1
            fi
            name="${key#"$PREFIX"}"
          fi
          echo "Backup: $name"

          aws s3 cp "s3://$BACKUP_BUCKET/$PREFIX$name" "$RUNNER_TEMP/backup.dump.gpg" \
            --endpoint-url "$BACKUP_ENDPOINT" --only-show-errors
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --output "$RUNNER_TEMP/backup.dump" --decrypt "$RUNNER_TEMP/backup.dump.gpg" 3< <(printf '%s' "$BACKUP_PASSPHRASE")
          rm -f "$RUNNER_TEMP/backup.dump.gpg"
          pg_restore --list "$RUNNER_TEMP/backup.dump" > /dev/null
          echo "Decrypted: $(stat -c %s "$RUNNER_TEMP/backup.dump") bytes"

      # One transaction: the target ends up with the whole backup or with nothing.
      - name: Restore
        env:
          RESTORE_TARGET_URL: ${{ secrets.RESTORE_TARGET_URL }}
        run: |
          if ! pg_restore --no-owner --no-privileges --exit-on-error --single-transaction \
            --dbname="$RESTORE_TARGET_URL" "$RUNNER_TEMP/backup.dump" 2> "$RUNNER_TEMP/restore.err"; then
            # Only pg_restore's own error lines: the DETAIL and CONTEXT lines can quote row data.
            grep '^pg_restore: error:' "$RUNNER_TEMP/restore.err" | cut -c 1-300 || true
            echo "::error::Restore failed. Nothing was kept in the target."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/backup.dump" "$RUNNER_TEMP/restore.err"
          echo "Restore finished."

      - name: Compare row counts with production
        env:
          RESTORE_TARGET_URL: ${{ secrets.RESTORE_TARGET_URL }}
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: |
          counts_sql="select table_name, (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I.%I', table_schema, table_name), false, true, '')))[1]::text
            from information_schema.tables where table_schema = 'public' and table_type = 'BASE TABLE' order by 1"
          psql -X -q -t -A -F ' ' -v ON_ERROR_STOP=1 --dbname="$RESTORE_TARGET_URL" -c "$counts_sql" > "$RUNNER_TEMP/restored.txt"
          # Production may be the thing that broke, so its counts are optional.
          if ! psql -X -q -t -A -F ' ' -v ON_ERROR_STOP=1 --dbname="$NEON_DIRECT_URL" -c "$counts_sql" > "$RUNNER_TEMP/production.txt" 2> /dev/null; then
            echo "::warning::Could not read production, so only the restored counts are shown."
            : > "$RUNNER_TEMP/production.txt"
          fi
          # Rows written after the backup was taken also show as differences.
          # FILENAME, not NR == FNR, so an empty production file still works.
          awk 'FILENAME == ARGV[1] { prod[$1] = $2; next }
               { p = ($1 in prod) ? prod[$1] : "-"; status = (p == $2) ? "same" : "differs"; if (status == "differs") diff++
                 printf "%-24s restored %8s   production %8s   %s\n", $1, $2, p, status }
               END { print ""; if (diff) print diff " table(s) differ from production."; else print "Every table matches production." }' \
            "$RUNNER_TEMP/production.txt" "$RUNNER_TEMP/restored.txt"

      # Only counts and page numbers are printed, never file names or contents.
      - name: Check the bill PDFs open
        env:
          RESTORE_TARGET_URL: ${{ secrets.RESTORE_TARGET_URL }}
        run: |
          q() { psql -X -q -t -A -v ON_ERROR_STOP=1 --dbname="$RESTORE_TARGET_URL" -c "$1"; }
          # Tables are named with their schema, since the target's search_path may leave out public.
          # The list is captured first so a failed query fails the step.
          id_list=$(q "select id from public.bill_file order by id")
          mapfile -t ids < <(grep -v '^$' <<< "$id_list" || true)
          total=${#ids[@]}
          if [ "$total" -eq 0 ]; then
            echo "No bill files stored, so there is nothing to check."
            exit 0
          fi
          failed=0
          n=0
          for id in "${ids[@]}"; do
            n=$((n + 1))
            q "select encode(bytes, 'base64') from public.bill_file where id = '$id'" | base64 -d > "$RUNNER_TEMP/bill.pdf"
            meta=$(q "select \"sizeBytes\", coalesce(\"pageCount\"::text, '') from public.bill_file where id = '$id'")
            IFS='|' read -r stored_size stored_pages <<< "$meta"
            size=$(stat -c %s "$RUNNER_TEMP/bill.pdf")
            if pages=$(pdfinfo "$RUNNER_TEMP/bill.pdf" 2> /dev/null | awk '/^Pages:/ { print $2 }') && [ -n "$pages" ]; then
              note="opens, $pages page(s)"
              [ -n "$stored_pages" ] && [ "$stored_pages" != "$pages" ] && { note="$note, but $stored_pages stored"; failed=$((failed + 1)); }
            else
              note="does not open"
              failed=$((failed + 1))
            fi
            if [ "$size" != "$stored_size" ]; then
              note="$note, size $size bytes but $stored_size stored"
              failed=$((failed + 1))
            fi
            echo "Bill file $n of $total: $note"
            rm -f "$RUNNER_TEMP/bill.pdf"
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed problem(s) with the restored bill files."
            exit 1
          fi
          echo "All $total bill files open and match their stored size."
