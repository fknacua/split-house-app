name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # One install at the repo root covers backend, app and shared (npm workspaces).
      - run: npm ci

      # The Prisma client is generated, not committed, and the backend imports it.
      - name: Generate the Prisma client
        run: npx prisma generate
        working-directory: backend

      # Next generates global types such as LayoutProps; tsc needs them and they are not committed.
      - name: Generate the Next.js route types
        run: npx next typegen
        working-directory: backend

      # Each check runs even when an earlier one failed, so one run shows every problem.
      - name: Type check (shared, backend, app)
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Tests
        if: ${{ !cancelled() }}
        run: npm test
