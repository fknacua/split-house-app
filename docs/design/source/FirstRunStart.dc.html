<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First-run start month</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 848px; box-sizing: border-box; padding: 8px; background: #0B0C0C; border-radius: 26px; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: {{c.onSurface}}">
<div style="position: relative; width: 384px; height: 832px; border-radius: 18px; overflow: hidden; background: {{c.background}}; display: flex; flex-direction: column">
<div style="position: absolute; top: 12px; left: 186px; width: 12px; height: 12px; border-radius: 6px; background: #050505; box-shadow: 0 0 0 2px #1C1D1E"></div>
<div style="height: 36px; flex-shrink: 0"></div>

<header style="display: flex; align-items: center; gap: 4px; padding: 4px 8px; height: 56px; flex-shrink: 0">
<a href="{{backHref}}" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; color: {{c.onSurface}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
</a>
<div style="display: flex; flex-direction: column">
<span style="font-size: 20px; line-height: 28px; font-weight: 800">Start month</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.onSurfaceVariant}}">When tracking begins</span>
</div>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px">
<!-- gluestack Radio group as selectable cards -->
<div role="radiogroup" aria-label="Household starts" style="flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{options}}" as="q" hint-placeholder-count="3">
<a href="{{q.href}}" role="radio" aria-checked="{{q.checked}}" style="background: {{c.surface}}; border: {{q.border}}; border-radius: 20px; padding: 16px; min-height: 96px; display: flex; align-items: center; gap: 12px; box-sizing: border-box; color: inherit; text-decoration: none">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.onSurfaceVariant}}">{{q.kicker}}</span>
<span style="font-size: 18px; line-height: 24px; font-weight: 800">{{q.title}}</span>
<sc-if value="{{q.hasNote}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{q.noteFg}}">{{q.note}}</span></sc-if>
</div>
<sc-if value="{{q.isCal}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.onSurfaceVariant}}"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg></sc-if>
<sc-if value="{{q.isRadio}}" hint-placeholder-val="{{true}}"><span style="flex-shrink: 0; width: 24px; height: 24px; box-sizing: border-box; border-radius: 12px; border: 2px solid {{q.radioBorder}}; display: flex; align-items: center; justify-content: center"><sc-if value="{{q.on}}" hint-placeholder-val="{{false}}"><span style="width: 12px; height: 12px; border-radius: 6px; background: {{c.primary}}"></span></sc-if></span></sc-if>
</a>
</sc-for>
</div>
<sc-if value="{{hasInfo}}" hint-placeholder-val="{{false}}">
<!-- gluestack Alert, info -->
<div role="status" style="flex-shrink: 0; background: {{c.infoTint}}; border: 1px solid {{c.infoLine}}; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; color: {{c.onInfoContainer}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px; color: {{c.info}}"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<span style="font-size: 13px; line-height: 18px; font-weight: 600">{{info}}</span>
</div>
</sc-if>
</main>

<footer style="flex-shrink: 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 4px; background: {{c.background}}; box-shadow: {{c.footShadow}}">
<!-- gluestack Button, solid -->
<a href="{{ctaHref}}" style="height: 48px; border-radius: 999px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; line-height: 20px; font-weight: 700">Save</a>
</footer>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","next","far"],"default":"default"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.theme === 'dark';
    var st = this.props.state || 'default';
    var c = dark ? {
      background: '#111214', surface: '#1A1C1E', container: '#222427', sheet: '#222427',
      onSurface: '#E3E3E6', onSurfaceVariant: '#C4C6CB', outline: '#8E9196', outlineVariant: '#2E3134',
      primary: '#E2E2E6', onPrimary: '#1A1C1E', selected: '#2C2F33', onSelected: '#E3E3E6',
      disabledBg: '#222427', disabledFg: '#5C5F64', track: '#3A3E43', scrim: 'rgba(0,0,0,0.6)',
      success: '#66BB6A', successContainer: '#1B5E20', onSuccessContainer: '#CBE4CB',
      warning: '#FFA726', warningContainer: '#66430F', onWarningContainer: '#FFE2B7', warningTint: '#332108', warningLine: '#F57C00',
      danger: '#F44336', dangerTint: '#3B1511', dangerLine: '#D32F2F', onDangerTint: '#FFD9D6',
      info: '#29B6F6', infoTint: '#082431', infoLine: '#1B76A0', infoContainer: '#104962', onInfoContainer: '#B8E7FB',
      footShadow: '0 -8px 16px rgba(0,0,0,0.45)'
    } : {
      background: '#F5F5F7', surface: '#FFFFFF', container: '#E9EAED', sheet: '#FFFFFF',
      onSurface: '#1A1C1E', onSurfaceVariant: '#45484C', outline: '#74777C', outlineVariant: '#E6E7EA',
      primary: '#2B2F33', onPrimary: '#FFFFFF', selected: '#E6E7EA', onSelected: '#1A1C1E',
      disabledBg: '#E9EAED', disabledFg: '#9A9DA2', track: '#D3D5D9', scrim: 'rgba(0,0,0,0.5)',
      success: '#2E7D32', successContainer: '#C8E6C9', onSuccessContainer: '#1E4620',
      warning: '#E65100', warningContainer: '#FBE2CC', onWarningContainer: '#663C00', warningTint: '#FFF4E5', warningLine: '#FBE2CC',
      danger: '#D32F2F', dangerTint: '#FDEDED', dangerLine: '#F6D5D5', onDangerTint: '#5F2120',
      info: '#0288D1', infoTint: '#E5F6FD', infoLine: '#CCE7F6', infoContainer: '#CCE7F6', onInfoContainer: '#014361',
      footShadow: '0 -6px 14px rgba(0,0,0,0.14)'
    };
    var T = dark ? 'Dark' : 'Light';
    var P = 'FirstRunStart-';
    var cur = { default: 0, next: 1, far: 2 }[st];
    var far = cur === 2;
    var cards = [
      { kicker: 'This month', title: 'November 2026', note: 'Due dates before today start as overdue', noteFg: c.onWarningContainer, href: P + 'Default-' + T + '.dc.html' },
      { kicker: 'Next month', title: 'December 2026', note: '', noteFg: c.onSurfaceVariant, href: P + 'Next-' + T + '.dc.html' },
      far
        ? { kicker: 'Another month', title: 'January 2027', note: '', noteFg: c.onSurfaceVariant, isCal: true, href: P + 'Picker-' + T + '.dc.html' }
        : { kicker: 'Another month', title: 'Choose from the calendar', note: '', noteFg: c.onSurfaceVariant, isCal: true, href: P + 'Picker-' + T + '.dc.html' }
    ].map(function (q, i) {
      var on = i === cur;
      q.on = on; q.checked = String(on); q.isRadio = !q.isCal; q.hasNote = !!q.note;
      q.border = on ? '2px solid ' + c.primary : '2px solid transparent';
      q.radioBorder = on ? c.primary : c.outline;
      return q;
    });
    return {
      c: c, options: cards, hasInfo: far, info: 'That’s a long wait. Are you sure you want to start in January 2027?',
      backHref: dark ? 'Welcome-Empty-Dark.dc.html' : 'Welcome.dc.html',
      ctaHref: 'Welcome-Started-' + T + '.dc.html'
    };
  }
}
</script>
</body>
</html>
