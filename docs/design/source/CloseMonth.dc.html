<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Close the month</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 400px; height: 848px; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: {{c.onSurface}}">
<!-- The screen behind: Home, all settled -->
<dc-import name="Main" state="settled" theme="{{theme}}" hint-size="400px,848px"></dc-import>
<div style="position: absolute; z-index: 10; top: 8px; left: 8px; width: 384px; height: 832px; border-radius: 18px; background: {{c.scrim}}"></div>
<div style="position: absolute; z-index: 11; top: 8px; left: 8px; width: 384px; height: 832px; border-radius: 18px; display: flex; align-items: center; justify-content: center; padding: 0 24px; box-sizing: border-box">
<!-- gluestack AlertDialog (blocking, two actions) -->
<section role="alertdialog" aria-labelledby="cm-title" aria-describedby="cm-body" aria-busy="{{busyAttr}}" style="width: 100%; box-sizing: border-box; background: {{c.sheet}}; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<span style="align-self: center; width: 48px; height: 48px; border-radius: 24px; background: {{c.dangerLine}}; color: {{c.onDangerTint}}; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
</span>
<h1 id="cm-title" style="margin: 0; text-align: center; font-size: 20px; line-height: 28px; font-weight: 800; letter-spacing: -0.3px">Close November?</h1>
<p id="cm-body" style="margin: 0; font-size: 14px; line-height: 20px; color: {{c.onSurfaceVariant}}">This closes November 2026 and starts December. You can’t undo this.</p>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{keeps}}" as="k" hint-placeholder-count="2">
<li style="display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 20px; font-weight: 500; color: {{c.onSurfaceVariant}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px; color: {{c.onSurfaceVariant}}"><path d="M20 6 9 17l-5-5"></path></svg>
{{k}}
</li>
</sc-for>
</ul>
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
<!-- Button (solid): Cancel, disabled while closing -->
<a href="{{cancelHref}}" aria-disabled="{{busyAttr}}" style="height: 48px; border-radius: 24px; background: {{cancelBg}}; color: {{cancelFg}}; pointer-events: {{evts}}; font-size: 15px; line-height: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Cancel</a>
<!-- Button (destructive outline): Confirm, spinner while closing -->
<a href="{{confirmHref}}" aria-disabled="{{busyAttr}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; height: 48px; box-sizing: border-box; border-radius: 24px; border: 1px solid {{confirmBorder}}; background: none; color: {{confirmFg}}; pointer-events: {{evts}}; font-family: inherit; font-size: 15px; line-height: 20px; font-weight: 700">
<sc-if value="{{isSaving}}" hint-placeholder-val="{{false}}"><!-- gluestack Spinner --><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" opacity="0.25"></circle><path d="M21 12a9 9 0 0 0-9-9"></path></svg></sc-if>
Confirm
</a>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["idle","saving"],"default":"idle"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    var theme = this.props.theme === 'dark' ? 'dark' : 'light';
    var dark = theme === 'dark';
    var saving = this.props.state === 'saving';
    var c = dark ? {
      sheet: '#222427', onSurface: '#E3E3E6', onSurfaceVariant: '#C4C6CB', primary: '#E2E2E6', onPrimary: '#1A1C1E',
      disabledBg: '#2C2F33', disabledFg: '#5C5F64', outlineVariant: '#2E3134',
      danger: '#F44336', dangerLine: '#D32F2F', onDangerTint: '#FFD9D6', scrim: 'rgba(0,0,0,0.6)'
    } : {
      sheet: '#FFFFFF', onSurface: '#1A1C1E', onSurfaceVariant: '#45484C', primary: '#2B2F33', onPrimary: '#FFFFFF',
      disabledBg: '#E9EAED', disabledFg: '#9A9DA2', outlineVariant: '#E6E7EA',
      danger: '#D32F2F', dangerLine: '#F6D5D5', onDangerTint: '#5F2120', scrim: 'rgba(0,0,0,0.5)'
    };
    var T = dark ? 'Dark' : 'Light';
    return {
      c: c, theme: theme, isSaving: saving,
      busyAttr: saving ? 'true' : 'false', evts: saving ? 'none' : 'auto',
      keeps: ['November moves to History and becomes read-only', 'Changes to any household configuration will take effect after December'],
      cancelBg: saving ? c.disabledBg : c.primary, cancelFg: saving ? c.disabledFg : c.onPrimary,
      confirmBorder: saving ? c.disabledFg : c.danger, confirmFg: saving ? c.disabledFg : c.danger,
      cancelHref: dark ? 'Home-Settled-Dark.dc.html' : 'Home-Settled-Light.dc.html',
      confirmHref: 'Home-NextMonth-' + T + '.dc.html'
    };
  }
}
</script>
</body>
</html>
