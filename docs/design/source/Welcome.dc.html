<h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 800">{{heading}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 500; color: {{c.onSurfaceVariant}}">{{intro}}</p>
<sc-if value="{{showProgress}}" hint-placeholder-val="{{false}}">
<!-- gluestack Progress, segmented (one segment per step) -->
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 4px">
<div style="display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; font-weight: 700"><span>{{progressText}}</span><span style="color: {{c.onSurfaceVariant}}; font-weight: 600">{{progressNote}}</span></div>
<div role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="{{progressNow}}" style="display: flex; gap: 4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
<div style="flex: 1 1 0; min-width: 0; height: 4px; border-radius: 2px; background: {{b.bg}}"></div>
</sc-for>
</div>
</div>
</sc-if>
</section>

<sc-if value="{{isSetup}}" hint-placeholder-val="{{true}}">
<!-- gluestack Card -->
<section aria-label="Setup steps" style="background: {{c.surface}}; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<a href="{{s.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 10px 12px 16px; box-sizing: border-box; border-top: 1px solid {{s.divider}}; background: {{s.rowBg}}; color: inherit; text-decoration: none">
<span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; box-sizing: border-box; border: 2px solid {{s.dotBorder}}; background: {{s.dotBg}}; color: {{s.dotFg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">
<sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{s.notDone}}" hint-placeholder-val="{{true}}">{{s.n}}</sc-if>
</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 700">{{s.title}}
<sc-if value="{{s.optional}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 10px; border-radius: 999px; display: flex; align-items: center; font-size: 12px; line-height: 16px; font-weight: 700; background: {{c.container}}; color: {{c.onSurfaceVariant}}">Optional</span></sc-if>
</span>
