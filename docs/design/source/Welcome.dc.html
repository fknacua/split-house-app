<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First-run setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 848px; box-sizing: border-box; padding: 8px; background: #0B0C0C; border-radius: 26px; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: {{c.onSurface}}">
<div style="position: relative; width: 384px; height: 832px; border-radius: 18px; overflow: hidden; background: {{c.background}}; display: flex; flex-direction: column">
<div style="position: absolute; top: 12px; left: 186px; width: 12px; height: 12px; border-radius: 6px; background: #050505; box-shadow: 0 0 0 2px #1C1D1E"></div>

<div style="height: 36px; flex-shrink: 0"></div>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 20px">

<section style="display: flex; flex-direction: column; gap: 12px; padding: 8px 4px 0">
<span style="width: 56px; height: 56px; border-radius: 18px; background: {{c.selected}}; color: {{c.onSelected}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isSetup}}" hint-placeholder-val="{{true}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></sc-if>
<sc-if value="{{isNotif}}" hint-placeholder-val="{{false}}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg></sc-if>
</span>
<h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 800">{{heading}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 500; color: {{c.onSurfaceVariant}}">{{intro}}</p>
<sc-if value="{{showProgress}}" hint-placeholder-val="{{false}}">
<!-- gluestack Progress, segmented (one segment per step) -->
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 4px">
<div style="display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; font-weight: 700"><span>{{progressText}}</span><span style="color: {{c.onSurfaceVariant}}; font-weight: 600">{{progressNote}}</span></div>
<div role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="{{progressNow}}" style="display: flex; gap: 4px">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
<div style="flex: 1 1 0; min-width: 0; height: 4px; border-radius: 2px; background: {{b.bg}}"></div>
</sc-for>
</div>
</div>
</sc-if>
</section>

<sc-if value="{{isSetup}}" hint-placeholder-val="{{true}}">
<!-- gluestack Card -->
<section aria-label="Setup steps" style="background: {{c.surface}}; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<a href="{{s.href}}" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 10px 12px 16px; box-sizing: border-box; border-top: 1px solid {{s.divider}}; background: {{s.rowBg}}; color: inherit; text-decoration: none">
<span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; box-sizing: border-box; border: 2px solid {{s.dotBorder}}; background: {{s.dotBg}}; color: {{s.dotFg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800">
<sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{s.notDone}}" hint-placeholder-val="{{true}}">{{s.n}}</sc-if>
</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 700">{{s.title}}
<sc-if value="{{s.optional}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 10px; border-radius: 999px; display: flex; align-items: center; font-size: 12px; line-height: 16px; font-weight: 700; background: {{c.container}}; color: {{c.onSurfaceVariant}}">Optional</span></sc-if>
</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.onSurfaceVariant}}">{{s.detail}}</span>
</div>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.onSurfaceVariant}}"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</sc-for>
</section>

<!-- gluestack Card (dashed outline) -->
<section style="border: 1px dashed {{c.outline}}; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; color: {{c.onSurfaceVariant}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; line-height: 20px; font-weight: 700; color: {{c.onSurface}}">Then: upload your first utilities bill</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 600">This month’s charges appear here once the household is set up.</span>
</div>
</section>
</sc-if>
</main>

<footer style="flex-shrink: 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 4px; background: {{c.background}}; box-shadow: {{c.footShadow}}">
<!-- gluestack Button, solid -->
<a href="{{ctaHref}}" style="height: 48px; border-radius: 999px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none">
{{ctaLabel}}
<sc-if value="{{isSetup}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></sc-if>
</a>
<sc-if value="{{isNotif}}" hint-placeholder-val="{{false}}">
<!-- gluestack Button, link -->
<a href="{{skipHref}}" style="height: 48px; border-radius: 999px; color: {{c.onSurface}}; display: flex; align-items: center; justify-content: center; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none">Not now</a>
</sc-if>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["empty","progress","notifications"],"default":"empty"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.theme === 'dark';
    var st = this.props.state || 'empty';
    var c = dark ? {
      background: '#111214', surface: '#1A1C1E', container: '#222427', sheet: '#222427',
      onSurface: '#E3E3E6', onSurfaceVariant: '#C4C6CB', outline: '#8E9196', outlineVariant: '#2E3134',
      primary: '#E2E2E6', onPrimary: '#1A1C1E', selected: '#2C2F33', onSelected: '#E3E3E6',
      disabledBg: '#222427', disabledFg: '#5C5F64', track: '#3A3E43', scrim: 'rgba(0,0,0,0.6)',
      success: '#66BB6A', successContainer: '#1B5E20', onSuccessContainer: '#CBE4CB',
      footShadow: '0 -8px 16px rgba(0,0,0,0.45)'
    } : {
      background: '#F5F5F7', surface: '#FFFFFF', container: '#E9EAED', sheet: '#FFFFFF',
      onSurface: '#1A1C1E', onSurfaceVariant: '#45484C', outline: '#74777C', outlineVariant: '#E6E7EA',
      primary: '#2B2F33', onPrimary: '#FFFFFF', selected: '#E6E7EA', onSelected: '#1A1C1E',
      disabledBg: '#E9EAED', disabledFg: '#9A9DA2', track: '#D3D5D9', scrim: 'rgba(0,0,0,0.5)',
      success: '#2E7D32', successContainer: '#C8E6C9', onSuccessContainer: '#1E4620',
      footShadow: '0 -6px 14px rgba(0,0,0,0.14)'
    };
    var H = dark ? {
      home: 'Household-EditHome-Dark.dc.html', add: 'Household-AddPerson-Dark.dc.html',
      split: 'Household-SplitError-Dark.dc.html', tpl: 'Settings-Template-Dark.dc.html',
      notif: 'Welcome-Notifications-Dark.dc.html', first: 'Home-Upload-Dark.dc.html'
    } : {
      home: 'Household-EditHome-Light.dc.html', add: 'Household-AddPerson-Light.dc.html',
      split: 'Household-SplitError-Light.dc.html', tpl: 'Settings-Template-Light.dc.html',
      notif: 'Welcome-Notifications-Light.dc.html', first: 'Main.dc.html'
    };
    var progress = st === 'progress';
    var notif = st === 'notifications';
    var raw = [
      { n: '1', title: 'Rent & rooms', href: H.home,
        detail: progress ? '$4,300.00 to the landlord on the 1st · 6 aircon units' : 'What you pay the landlord, and when', done: progress },
      { n: '2', title: 'People', href: H.add,
        detail: progress ? 'Primary Tenant, Tenant 1 and Tenant 2 · 5 utility shares' : 'Who pays you: rent, shares, due dates, WhatsApp', done: progress },
      { n: '3', title: 'Your split', href: H.split,
        detail: 'How you and your partner share what’s left · 50/50 to start', done: false, current: progress },
      { n: '4', title: 'Messages', href: H.tpl, optional: true,
        detail: 'A message template is ready. Tweak the wording if you like', done: false },
      { n: '5', title: 'Reminders', href: H.notif, optional: true,
        detail: 'A heads-up on bill day and when a payment is overdue', done: false }
    ];
    var steps = raw.map(function (s, i) {
      var cur = !!s.current || (!progress && i === 0);
      return {
        n: s.n, title: s.title, detail: s.detail, href: s.href, optional: !!s.optional,
        done: s.done, notDone: !s.done,
        divider: i === 0 ? 'transparent' : c.outlineVariant,
        rowBg: cur ? c.selected : 'transparent',
        dotBg: s.done ? c.successContainer : (cur ? c.primary : 'transparent'),
        dotFg: s.done ? c.onSuccessContainer : (cur ? c.onPrimary : c.onSurfaceVariant),
        dotBorder: s.done ? c.successContainer : (cur ? c.primary : c.outline)
      };
    });
    var doneCount = notif ? 3 : 2;
    var bars = [0, 1, 2, 3].map(function (i) { return { bg: i < doneCount ? c.primary : c.track }; });
    return {
      c: c, steps: steps, bars: bars,
      isSetup: !notif, isNotif: notif, showProgress: progress || notif,
      progressText: doneCount + ' of 4 steps done', progressNow: String(doneCount),
      progressNote: notif ? 'Reminders are optional' : 'Messages are optional',
      heading: notif ? 'Turn on reminders' : (progress ? 'Almost there' : 'Set up your household'),
      intro: notif
        ? 'Get a heads-up on bill day and when someone’s payment is overdue. Android will ask for permission next.'
        : (progress
          ? 'One more step and you can upload your first utilities bill.'
          : 'Tell the app who lives here and what everyone pays. You only do this once — after that it’s one bill a month.'),
      ctaLabel: notif ? 'Continue' : (progress ? 'Continue: Your split' : 'Start with rent & rooms'),
      ctaHref: notif ? H.first : (progress ? H.split : H.home),
      skipHref: H.first
    };
  }
}
</script>
</body>
</html>
