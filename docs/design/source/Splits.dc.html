<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Household split editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 848px; box-sizing: border-box; padding: 8px; background: #0B0C0C; border-radius: 26px; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: {{c.onSurface}}">
<div style="position: relative; width: 384px; height: 832px; border-radius: 18px; overflow: hidden; background: {{c.background}}; display: flex; flex-direction: column">
<div style="position: absolute; top: 12px; left: 186px; width: 12px; height: 12px; border-radius: 6px; background: #050505; box-shadow: 0 0 0 2px #1C1D1E"></div>
<div style="height: 36px; flex-shrink: 0"></div>

<header style="display: flex; align-items: center; gap: 4px; padding: 4px 8px; height: 56px; flex-shrink: 0">
<a href="{{backHref}}" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; color: {{c.onSurface}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
</a>
<span style="font-size: 20px; line-height: 28px; font-weight: 800">Household split</span>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px">
<!-- Starts from: all three sections below take effect from this month -->
<div style="display: flex; flex-direction: column; gap: 6px">
<label id="fromLabel" style="font-size: 14px; line-height: 20px; font-weight: 700; color: {{c.onSurface}}">Starts from</label>
<a href="{{pickHref}}" aria-haspopup="dialog" aria-labelledby="fromLabel fromValue" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{c.outline}}; border-radius: 12px; background: {{c.surface}}; display: flex; align-items: center; gap: 8px; font-family: inherit; color: {{c.onSurface}}; text-decoration: none">
<span id="fromValue" style="flex-grow: 1; min-width: 0; font-size: 16px; line-height: 24px; font-weight: 500">January 2027</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.onSurface}}"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
</a>
</div>

<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<!-- gluestack Card -->
<section style="background: {{c.surface}}; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 700">{{s.title}}</h2>
<sc-for list="{{s.rows}}" as="r" hint-placeholder-count="4">
<!-- gluestack FormControl + Input, one per person; tenants other than Primary Tenant also get an Include in total switch -->
<div style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; min-height: 48px">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: {{r.color}}"></span>
<label for="{{r.id}}" style="flex-grow: 1; min-width: 0; font-size: 15px; line-height: 20px; font-weight: 600">{{r.name}}</label>
<div style="width: 128px; flex-shrink: 0; height: 44px; box-sizing: border-box; border: 1px solid {{r.border}}; box-shadow: {{r.ring}}; border-radius: 12px; background: {{c.surface}}; display: flex; align-items: center; padding: 0 12px; opacity: {{r.fieldOpacity}}">
<input id="{{r.id}}" inputmode="decimal" value="{{r.value}}" placeholder="{{r.placeholder}}" style="width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; text-align: right; font-family: Manrope, sans-serif; font-size: 16px; font-weight: 500; color: {{c.onSurface}}; font-variant-numeric: tabular-nums">
</div>
</div>
<sc-if value="{{r.hasSwitch}}" hint-placeholder-val="{{false}}">
<!-- gluestack Switch -->
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 0 4px 20px; min-height: 44px">
<span style="font-size: 14px; line-height: 20px; font-weight: 500; color: {{c.onSurfaceVariant}}">Include in total</span>
<button role="switch" aria-checked="{{r.on}}" aria-label="Include {{r.name}} in the total" onClick="{{r.toggle}}" style="width: 52px; height: 32px; padding: 0; border: 0; border-radius: 16px; background: {{r.trackBg}}; position: relative; flex-shrink: 0; cursor: pointer"><span style="position: absolute; top: 4px; left: {{r.thumbLeft}}; width: 24px; height: 24px; border-radius: 12px; background: {{r.thumbBg}}; transition: left 0.15s ease"></span></button>
</div>
</sc-if>
<sc-if value="{{r.hasCheck}}" hint-placeholder-val="{{false}}">
<!-- gluestack Checkbox -->
<button role="checkbox" aria-checked="{{r.on}}" onClick="{{r.toggle}}" style="align-self: flex-end; display: flex; align-items: center; gap: 10px; margin-right: 2px; min-height: 44px; padding: 0; border: 0; background: none; color: {{c.onSurface}}; font-family: inherit; cursor: pointer">
<span aria-hidden="true" style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 6px; border: 2px solid {{r.boxLine}}; background: {{r.boxBg}}; display: flex; align-items: center; justify-content: center; color: {{c.onPrimary}}"><sc-if value="{{r.on2}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
<span style="font-size: 14px; line-height: 20px; font-weight: 500; color: {{c.onSurfaceVariant}}">Include in total</span>
</button>
</sc-if>
</div>
</sc-for>
<sc-if value="{{s.hasError}}" hint-placeholder-val="{{false}}">
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.danger}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>{{s.error}}</span>
</sc-if>
<sc-if value="{{s.hasWarn}}" hint-placeholder-val="{{false}}">
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.warning}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>{{s.warn}}</span>
</sc-if>
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid {{c.outlineVariant}}; font-size: 14px; line-height: 20px; font-weight: 700">
<span style="color: {{c.onSurfaceVariant}}">Total</span>
<span style="font-variant-numeric: tabular-nums">{{s.total}}</span>
</div>
</section>
</sc-for>
</main>

<footer style="flex-shrink: 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 4px; background: {{c.background}}; box-shadow: {{c.footShadow}}">
<sc-if value="{{showSummary}}" hint-placeholder-val="{{false}}">
<!-- gluestack Card: only what changed -->
<section aria-live="polite" style="background: {{c.surface}}; border-radius: 20px; padding: 10px 14px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 700; color: {{c.onSurfaceVariant}}">Saves from Jan 2027</h2>
<sc-for list="{{summary}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 500">
<span style="color: {{c.onSurfaceVariant}}">{{r.label}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums">
<span style="color: {{c.onSurfaceVariant}}; text-decoration: line-through">{{r.from}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{c.onSurfaceVariant}}"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
<span style="font-weight: 800">{{r.to}}</span>
</span>
</div>
</sc-for>
</section>
</sc-if>
<sc-if value="{{hasErrors}}" hint-placeholder-val="{{false}}">
<!-- gluestack Alert, danger -->
<div role="alert" style="background: {{c.dangerTint}}; border: 1px solid {{c.dangerLine}}; border-radius: 12px; padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px; font-weight: 700; color: {{c.onDangerTint}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.danger}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>
Some errors in the form
</div>
</sc-if>
<!-- gluestack Button, solid / disabled -->
<button aria-disabled="{{saveDisabled}}" style="height: 48px; border-radius: 999px; border: 0; background: {{saveBg}}; color: {{saveFg}}; font-family: inherit; font-size: 15px; line-height: 20px; font-weight: 700">Save changes</button>
<!-- gluestack Button, link -->
<a href="{{backHref}}" style="height: 48px; border-radius: 999px; color: {{c.primary}}; font-size: 15px; line-height: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Cancel</a>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["unchanged","changed","error","warning"],"default":"unchanged"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.theme === 'dark';
    var st = this.props.state || 'unchanged';
    var c = dark ? {
      background: '#111214', surface: '#1A1C1E', container: '#222427', sheet: '#222427',
      onSurface: '#E3E3E6', onSurfaceVariant: '#C4C6CB', outline: '#8E9196', outlineVariant: '#2E3134',
      primary: '#E2E2E6', onPrimary: '#1A1C1E', selected: '#2C2F33', onSelected: '#E3E3E6',
      disabledBg: '#222427', disabledFg: '#5C5F64', track: '#3A3E43', scrim: 'rgba(0,0,0,0.6)',
      success: '#66BB6A', successContainer: '#1B5E20', onSuccessContainer: '#CBE4CB',
      warning: '#FFA726', warningContainer: '#66430F', onWarningContainer: '#FFE2B7', warningTint: '#332108', warningLine: '#F57C00',
      danger: '#F44336', dangerTint: '#3B1511', dangerLine: '#D32F2F', onDangerTint: '#FFD9D6',
      info: '#29B6F6', infoTint: '#082431', infoLine: '#1B76A0', infoContainer: '#104962', onInfoContainer: '#B8E7FB',
      footShadow: '0 -8px 16px rgba(0,0,0,0.45)'
    } : {
      background: '#F5F5F7', surface: '#FFFFFF', container: '#E9EAED', sheet: '#FFFFFF',
      onSurface: '#1A1C1E', onSurfaceVariant: '#45484C', outline: '#74777C', outlineVariant: '#E6E7EA',
      primary: '#2B2F33', onPrimary: '#FFFFFF', selected: '#E6E7EA', onSelected: '#1A1C1E',
      disabledBg: '#E9EAED', disabledFg: '#9A9DA2', track: '#D3D5D9', scrim: 'rgba(0,0,0,0.5)',
      success: '#2E7D32', successContainer: '#C8E6C9', onSuccessContainer: '#1E4620',
      warning: '#E65100', warningContainer: '#FBE2CC', onWarningContainer: '#663C00', warningTint: '#FFF4E5', warningLine: '#FBE2CC',
      danger: '#D32F2F', dangerTint: '#FDEDED', dangerLine: '#F6D5D5', onDangerTint: '#5F2120',
      info: '#0288D1', infoTint: '#E5F6FD', infoLine: '#CCE7F6', infoContainer: '#CCE7F6', onInfoContainer: '#014361',
      footShadow: '0 -6px 14px rgba(0,0,0,0.14)'
    };
    var PAL = [
      { l: '#1565C0', d: '#64B5F6' }, { l: '#BF4000', d: '#FFA040' }, { l: '#2E7D32', d: '#81C784' },
      { l: '#7B1FA2', d: '#CE93D8' }, { l: '#C2185B', d: '#F48FB1' }, { l: '#00796B', d: '#4DD0E1' }
    ];
    var col = function (i) { return dark ? PAL[i].d : PAL[i].l; };
    // person colors: You Teal, Primary Tenant Blue, Tenant 1 Orange, Tenant 2 Green
    var P = [ ['You', 5, 'y'], ['Primary Tenant', 0, 'p'], ['Tenant 1', 1, 't1'], ['Tenant 2', 2, 't2'] ];
    var base = {
      rent: ['1,675.00', '1,675.00', '950.00', '950.00'],
      util: ['1.5', '1.5', '1', '1'],
      air:  ['2', '2', '1', '1']
    };
    var cur = { rent: base.rent.slice(), util: base.util.slice(), air: base.air.slice() };
    var errors = { rent: '', util: '', air: '' };
    var warns = { rent: [], util: [], air: [] };
    var summary = [];
    var bad = {};
    // Include in total: tenants other than Primary Tenant (indexes 2 and 3). Default on. Excluded rows do not count toward the Total.
    var excl = {};
    if (st === 'changed') {
      cur.rent[3] = '1,000.00'; cur.util[0] = '2'; cur.util[1] = '1';
      summary = [
        { label: 'Tenant 2 rent', from: '$950.00', to: '$1,000.00' },
        { label: 'You · utilities', from: '1.5', to: '2' },
        { label: 'Primary Tenant · utilities', from: '1.5', to: '1' }
      ];
    }
    if (st === 'warning') {
      cur.rent[2] = '0.00'; excl['rent:3'] = true;
      summary = [
        { label: 'Tenant 1 rent', from: '$950.00', to: '$0.00' },
        { label: 'Tenant 2 rent in total', from: 'Included', to: 'Excluded' }
      ];
    }
    if (st === 'error') { cur.rent[2] = ''; bad['rent:2'] = true; errors.rent = 'Enter Tenant 1’s rent'; }
    var self = this;
    var ov = (this.state && this.state.excl) || {};
    Object.keys(ov).forEach(function (key) { excl[key] = ov[key]; });
    var num = function (s) { return s === '' ? 0 : parseFloat(String(s).replace(/,/g, '')); };
    var fmt = { rent: function (n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }, util: function (n) { return String(n); }, air: function (n) { return String(n); } };
    var titles = { rent: 'Rent (SGD)', util: 'Utilities (shares)', air: 'Aircon (units)' };
    var nouns = { rent: 'rent', util: 'shares', air: 'units' };
    var sections = ['rent', 'util', 'air'].map(function (k) {
      var total = 0, warn = [];
      var rows = P.map(function (p, i) {
        var key = k + ':' + i;
        var hasToggle = i >= 2 && k === 'rent';
        var out = !!excl[key];
        if (!out) total += num(cur[k][i]);
        var isBad = !!bad[key];
        // 0 is a valid amount: warn (not an error). Blank is the error.
        var isWarn = !isBad && !out && cur[k][i] !== '' && num(cur[k][i]) === 0;
        if (isWarn) warn.push(p[0] + ' ' + nouns[k] + ' is 0');
        return { id: k + p[2], name: p[0], color: col(p[1]), value: cur[k][i], placeholder: k === 'rent' ? '0.00' : '0',
          border: isBad ? c.danger : (isWarn ? c.warning : c.outline), ring: isBad ? ('0 0 0 1px ' + c.danger) : (isWarn ? ('0 0 0 1px ' + c.warning) : 'none'),
          fieldOpacity: '1',
          hasSwitch: false, hasCheck: i >= 2 && k === 'rent', on: String(!out), on2: !out, boxLine: out ? c.outline : c.primary, boxBg: out ? 'transparent' : c.primary, trackBg: out ? c.track : c.primary, thumbLeft: out ? '4px' : '24px', thumbBg: out ? c.outline : c.onPrimary,
          toggle: function () { var n = {}; Object.keys(excl).forEach(function (q) { n[q] = excl[q]; }); n[key] = !out; self.setState({ excl: n }); } };
      });
      return { title: titles[k], rows: rows, total: fmt[k](total), hasError: !!errors[k], error: errors[k], hasWarn: warn.length > 0, warn: warn.join(' · ') };
    });
    var changed = st === 'changed' || st === 'warning', err = st === 'error';
    var T = dark ? 'Dark' : 'Light';
    return {
      c: c, sections: sections, summary: summary, showSummary: changed, hasErrors: err,
      backHref: dark ? 'Household-View-Dark.dc.html' : 'Household.dc.html',
      pickHref: 'MonthPicker-' + T + '.dc.html',
      saveDisabled: changed ? 'false' : 'true', saveBg: changed ? c.primary : c.disabledBg, saveFg: changed ? c.onPrimary : c.disabledFg
    };
  }
}
</script>
</body>
</html>
