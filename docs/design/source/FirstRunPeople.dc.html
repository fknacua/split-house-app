<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First-run people</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 848px; box-sizing: border-box; padding: 8px; background: #0B0C0C; border-radius: 26px; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: {{c.onSurface}}">
<div style="position: relative; width: 384px; height: 832px; border-radius: 18px; overflow: hidden; background: {{c.background}}; display: flex; flex-direction: column">
<div style="position: absolute; top: 12px; left: 186px; width: 12px; height: 12px; border-radius: 6px; background: #050505; box-shadow: 0 0 0 2px #1C1D1E"></div>
<div style="height: 36px; flex-shrink: 0"></div>

<header style="display: flex; align-items: center; gap: 4px; padding: 4px 8px; height: 56px; flex-shrink: 0">
<a href="{{backHref}}" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; color: {{c.onSurface}}; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
</a>
<div style="display: flex; flex-direction: column">
<span style="font-size: 20px; line-height: 28px; font-weight: 800">People</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.onSurfaceVariant}}">Who pays you</span>
</div>
</header>

<main style="flex-grow: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="padding: 0 4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 20px"><h2 style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 700">People</h2>
<sc-if value="{{hasPeople}}" hint-placeholder-val="{{true}}"><!-- gluestack Button, link --><a href="{{addHref}}" style="margin: -14px -4px; min-height: 48px; padding: 0 4px; display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 700; color: {{c.primary}}; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6"></path><path d="M22 11h-6"></path></svg>Add more</a></sc-if>
</div>
<sc-if value="{{noPeople}}" hint-placeholder-val="{{false}}">
<!-- gluestack Card, empty state -->
<div style="background: {{c.surface}}; border-radius: 20px; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px">
<span style="font-size: 14px; line-height: 20px; font-weight: 600; color: {{c.onSurfaceVariant}}">No people yet</span>
<!-- gluestack Button, outline -->
<a href="{{addHref}}" style="height: 48px; box-sizing: border-box; padding: 0 20px; border-radius: 999px; border: 1px solid {{c.outline}}; background: transparent; color: {{c.onSurface}}; display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6"></path><path d="M22 11h-6"></path></svg>Add person</a>
</div>
</sc-if>
<sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
<!-- gluestack Skeleton cards -->
<sc-for list="{{skel}}" as="k" hint-placeholder-count="2">
<div aria-hidden="true" style="background: {{c.surface}}; border-radius: 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px"><div style="display: flex; align-items: center; gap: 12px"><span style="width: 40px; height: 40px; border-radius: 20px; background: {{c.skeleton}}"></span><span style="width: 120px; height: 14px; border-radius: 7px; background: {{c.skeleton}}"></span></div><div style="border-top: 1px solid {{c.outlineVariant}}; padding-top: 8px; display: flex; justify-content: flex-end"><span style="width: 72px; height: 44px; border-radius: 22px; background: {{c.skeleton}}"></span></div></div>
</sc-for>
</sc-if>
<sc-for list="{{people}}" as="p" hint-placeholder-count="2">
<!-- gluestack Card -->
<div style="background: {{c.surface}}; border-radius: 20px; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 20px; background: {{p.color}}; color: {{p.onColor}}; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 20px; font-weight: 800; flex-shrink: 0">{{p.initial}}</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 14px; line-height: 20px; font-weight: 700">{{p.name}}</span>
</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid {{c.outlineVariant}}; margin: 0 -2px; padding: 8px 0 0">
<!-- gluestack Button, outline, small -->
<a href="{{p.editHref}}" style="height: 44px; padding: 0 16px 0 14px; border-radius: 999px; border: 1px solid {{c.outline}}; color: {{c.onSurface}}; display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 700; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg>Edit</a>
</div>
</div>
</sc-for>
</div>
</main>

<footer style="flex-shrink: 0; padding: 10px 16px 28px; display: flex; flex-direction: column; gap: 4px; background: {{c.background}}; box-shadow: {{c.footShadow}}">
<sc-if value="{{isFailed}}" hint-placeholder-val="{{false}}">
<!-- gluestack Alert, danger: failed save -->
<div style="padding-bottom: 6px"><div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: {{c.dangerTint}}; border: 1px solid {{c.dangerLine}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.danger}}"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
<span style="font-size: 13px; line-height: 18px; font-weight: 700; color: {{c.onDangerTint}}">Couldn’t save people. Try again.</span>
</div></div>
</sc-if>
<!-- gluestack Button, solid / disabled -->
<a href="{{saveHref}}" aria-disabled="{{saveDisabled}}" style="height: 48px; border-radius: 999px; background: {{saveBg}}; color: {{saveFg}}; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 15px; line-height: 20px; font-weight: 700">{{saveLabel}}</a>
</footer>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["empty","one","list","failed","loading"],"default":"empty"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.theme === 'dark';
    var st = this.props.state || 'empty';
    var c = dark ? {
      background: '#111214', surface: '#1A1C1E', container: '#222427', sheet: '#222427',
      onSurface: '#E3E3E6', onSurfaceVariant: '#C4C6CB', outline: '#8E9196', outlineVariant: '#2E3134',
      primary: '#E2E2E6', onPrimary: '#1A1C1E', selected: '#2C2F33', onSelected: '#E3E3E6',
      disabledBg: '#222427', disabledFg: '#5C5F64', track: '#3A3E43', scrim: 'rgba(0,0,0,0.5)',
      success: '#66BB6A', successContainer: '#1B5E20', onSuccessContainer: '#CBE4CB',
      warning: '#FFA726', warningContainer: '#66430F', onWarningContainer: '#FFE2B7', warningTint: '#332108', warningLine: '#F57C00',
      skeleton: '#222427', danger: '#F44336', dangerTint: '#3B1511', dangerLine: '#D32F2F', onDangerTint: '#FFD9D6',
      info: '#29B6F6', infoTint: '#082431', infoLine: '#1B76A0', infoContainer: '#104962', onInfoContainer: '#B8E7FB',
      footShadow: '0 -8px 16px rgba(0,0,0,0.45)'
    } : {
      background: '#F5F5F7', surface: '#FFFFFF', container: '#E9EAED', sheet: '#FFFFFF',
      onSurface: '#1A1C1E', onSurfaceVariant: '#45484C', outline: '#74777C', outlineVariant: '#E6E7EA',
      primary: '#2B2F33', onPrimary: '#FFFFFF', selected: '#E6E7EA', onSelected: '#1A1C1E',
      disabledBg: '#E9EAED', disabledFg: '#9A9DA2', track: '#D3D5D9', scrim: 'rgba(0,0,0,0.5)',
      success: '#2E7D32', successContainer: '#C8E6C9', onSuccessContainer: '#1E4620',
      warning: '#E65100', warningContainer: '#FBE2CC', onWarningContainer: '#663C00', warningTint: '#FFF4E5', warningLine: '#FBE2CC',
      skeleton: '#E9EAED', danger: '#D32F2F', dangerTint: '#FDEDED', dangerLine: '#F6D5D5', onDangerTint: '#5F2120',
      info: '#0288D1', infoTint: '#E5F6FD', infoLine: '#CCE7F6', infoContainer: '#CCE7F6', onInfoContainer: '#014361',
      footShadow: '0 -6px 14px rgba(0,0,0,0.14)'
    };
    var T = dark ? 'Dark' : 'Light';
    var PAL = { pt: { l: '#1565C0', d: '#64B5F6' }, t1: { l: '#BF4000', d: '#FFA040' }, t2: { l: '#2E7D32', d: '#81C784' } };
    var onPal = dark ? '#111214' : '#FFFFFF';
    var PT = { initial: 'PT', name: 'Primary Tenant', role: 'Master room · pays you directly', col: PAL.pt, facts: [{ label: 'Rent · due 7th', value: '$1,675.00' }, { label: 'Utilities · due 7th', value: '1.5 shares' }], edit: 'Household-EditPrimary-', view: 'Household-ViewPrimary-' };
    var ALL = [
      { initial: 'T1', name: 'Tenant 1', role: 'Room 2 · pays via Primary Tenant', col: PAL.t1, facts: [{ label: 'Rent · due 28th', value: '$950.00' }, { label: 'Utilities · due 7th', value: '1 share' }], edit: 'Household-AddPersonFilledFRE-', view: 'Household-ViewTenant1-' },
      { initial: 'T2', name: 'Tenant 2', role: 'Room 3 · pays you directly', col: PAL.t2, facts: [{ label: 'Rent · due 1st', value: '$950.00' }, { label: 'Utilities · due 4th', value: '1 share' }], edit: 'Household-AddPersonFilled2FRE-', view: 'Household-ViewPerson-' }
    ];
    var n = (st === 'empty' || st === 'loading') ? 0 : (st === 'one' ? 1 : 2);
    var people = (n === 2 ? [PT].concat(ALL) : ALL.slice(0, n)).map(function (p, i) {
      return { initial: p.initial, name: p.name, role: p.role, facts: p.facts, color: dark ? p.col.d : p.col.l, onColor: onPal,
        editHref: p.edit + T + '.dc.html', viewHref: p.view + T + '.dc.html' };
    });
    var has = n > 0;
    return {
      c: c, isLoading: st === 'loading', skel: [1, 2], people: st === 'loading' ? [] : people, hasPeople: has && st !== 'loading', noPeople: !has && st !== 'loading', isFailed: st === 'failed',
      backHref: dark ? 'Welcome-Started-Dark.dc.html' : 'Welcome-Started-Light.dc.html',
      addHref: (n === 0 ? 'Household-AddPersonFilledFR-' : 'Household-AddPersonFilled2FR-') + T + '.dc.html',
      saveLabel: st === 'failed' ? 'Retry' : 'Save people', saveDisabled: has ? 'false' : 'true',
      saveBg: (has && st !== 'loading') ? c.primary : c.disabledBg, saveFg: (has && st !== 'loading') ? c.onPrimary : c.disabledFg,
      saveHref: has ? 'Welcome-Progress-' + T + '.dc.html' : '#'
    };
  }
}
</script>
</body>
</html>
