<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home CTAs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 848px; box-sizing: border-box; padding: 8px; background: #0B0C0C; border-radius: 26px; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: {{c.onSurface}}">
<div style="position: relative; width: 384px; height: 832px; border-radius: 18px; overflow: hidden; background: {{c.background}}; display: flex; flex-direction: column">
<div style="position: absolute; top: 12px; left: 186px; width: 12px; height: 12px; border-radius: 6px; background: #050505; box-shadow: 0 0 0 2px #1C1D1E; z-index: 20"></div>
<div style="height: 36px; flex-shrink: 0"></div>
<!-- Everything except the footer CTAs is an empty container -->
<div style="padding: 8px 16px; flex-grow: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px">
<div style="flex-shrink: 0; height: 36px; width: 180px; border-radius: 8px; background: {{c.container}}"></div>
<div style="flex-shrink: 0; height: 120px; border-radius: 20px; background: {{c.surface}}"></div>
<div style="flex-shrink: 0; height: 64px; border-radius: 20px; background: {{c.surface}}"></div>
<div style="flex-shrink: 0; height: 64px; border-radius: 20px; background: {{c.surface}}"></div>
<div style="flex-shrink: 0; height: 64px; border-radius: 20px; background: {{c.surface}}"></div>
<div style="flex-shrink: 0; height: 64px; border-radius: 20px; background: {{c.surface}}"></div>
<div style="flex-shrink: 0; height: 64px; border-radius: 20px; background: {{c.surface}}"></div>
<div style="flex-shrink: 0; height: 64px; border-radius: 20px; background: {{c.surface}}"></div>
</div>
<sc-if value="{{isUpload}}" hint-placeholder-val="{{false}}"><div style="flex-shrink: 0; padding: 10px 16px; background: {{c.background}}; border-top: 1px solid {{c.outlineVariant}}; box-shadow: {{c.footShadow}}; display: flex; gap: 8px"><a href="#" style="flex: 1 1 0; height: 48px; border-radius: 24px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m17 8-5-5-5 5"></path><path d="M12 3v12"></path></svg>Upload utilities bill</a></div></sc-if>
<sc-if value="{{isDraft}}" hint-placeholder-val="{{false}}"><div style="flex-shrink: 0; padding: 10px 16px; background: {{c.background}}; border-top: 1px solid {{c.outlineVariant}}; box-shadow: {{c.footShadow}}; display: flex; gap: 8px"><a href="#" style="flex: 1 1 0; height: 48px; border-radius: 24px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.659 22H18a2 2 0 0 0 2-2V8a2.4 2.4 0 0 0-.706-1.706l-3.588-3.588A2.4 2.4 0 0 0 14 2H6a2 2 0 0 0-2 2v9.34"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10.378 12.622a1 1 0 0 1 3 3.003L8.36 20.637a2 2 0 0 1-.854.506l-2.867.837a.5.5 0 0 1-.62-.62l.836-2.869a2 2 0 0 1 .506-.853z"></path></svg>Continue bill upload</a></div></sc-if>
<sc-if value="{{isCollecting}}" hint-placeholder-val="{{true}}"><div style="flex-shrink: 0; padding: 10px 16px; background: {{c.background}}; border-top: 1px solid {{c.outlineVariant}}; box-shadow: {{c.footShadow}}; display: flex; gap: 8px">
<a href="#" style="flex: 1 1 0; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 8px; border-radius: 24px; background: {{sBg}}; color: {{sFg}}; border: {{sBd}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; line-height: 20px; font-weight: 700; text-decoration: none; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"></path><path d="m21.854 2.147-10.94 10.939"></path></svg>Send message<sc-if value="{{sCount}}" hint-placeholder-val="{{true}}"><span style="flex-shrink: 0; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: {{c.onPrimary}}; color: {{c.primary}}; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; font-weight: 700">{{sN}}</span></sc-if></a>
<a href="#" style="flex: 1 1 0; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 8px; border-radius: 24px; background: {{rBg}}; color: {{rFg}}; border: {{rBd}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; line-height: 20px; font-weight: 700; text-decoration: none; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="12" x="2" y="6" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>Record payment<sc-if value="{{rCount}}" hint-placeholder-val="{{true}}"><span style="flex-shrink: 0; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: {{c.onPrimary}}; color: {{c.primary}}; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; font-weight: 700">{{rN}}</span></sc-if></a>
</div></sc-if>
<sc-if value="{{isBillDue}}" hint-placeholder-val="{{false}}"><div style="flex-shrink: 0; padding: 10px 16px; background: {{c.background}}; border-top: 1px solid {{c.outlineVariant}}; box-shadow: {{c.footShadow}}; display: flex; gap: 8px"><a href="#" style="flex: 1 1 0; height: 48px; border-radius: 24px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Mark bill paid</a></div></sc-if>
<sc-if value="{{isSettled}}" hint-placeholder-val="{{false}}"><div style="flex-shrink: 0; padding: 10px 16px; background: {{c.background}}; border-top: 1px solid {{c.outlineVariant}}; box-shadow: {{c.footShadow}}; display: flex; gap: 8px"><a href="#" style="flex: 1 1 0; height: 48px; border-radius: 24px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"></path><path d="M3 10h18"></path><path d="M19 16v6"></path><path d="M22 19h-6"></path></svg>Start next month</a></div></sc-if>
<div style="height: 94px; flex-shrink: 0; background: {{c.container}}"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["upload","draft","collecting","sentAll","billDue","settled"],"default":"collecting"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.theme === 'dark';
    var c = dark ? { background: '#111214', surface: '#1A1C1E', container: '#222427', onSurface: '#E3E3E6', outline: '#8E9196', outlineVariant: '#2E3134', primary: '#E2E2E6', onPrimary: '#1A1C1E', footShadow: '0 -8px 16px rgba(0,0,0,0.45)' }
      : { background: '#F5F5F7', surface: '#FFFFFF', container: '#E9EAED', onSurface: '#1A1C1E', outline: '#74777C', outlineVariant: '#E6E7EA', primary: '#2B2F33', onPrimary: '#FFFFFF', footShadow: '0 -6px 14px rgba(0,0,0,0.08)' };
    var sg = this.props.stage || 'collecting';
    var sentAll = sg === 'sentAll';
    return {
      c: c, isUpload: sg === 'upload', isDraft: sg === 'draft', isCollecting: sg === 'collecting' || sentAll, isBillDue: sg === 'billDue', isSettled: sg === 'settled',
      sBg: sentAll ? 'transparent' : c.primary, sFg: sentAll ? c.onSurface : c.onPrimary, sBd: sentAll ? '1px solid ' + c.outline : '0', sCount: !sentAll, sN: '2',
      rBg: c.primary, rFg: c.onPrimary, rBd: '0', rCount: true, rN: '2'
    };
  }
}
</script>
</body>
</html>
