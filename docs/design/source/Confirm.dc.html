    else if (k === 'recordSaving' || k === 'sentCheck') { v.cancelHref = '#'; v.confirmHref = '#'; }
    else if (k === 'recordMulti') { v.cancelHref = 'RecordPayment-All-' + T + '.dc.html'; v.confirmHref = 'Home-Overdue-' + T + '.dc.html'; }
    else if (k === 'discardAddPerson') { v.cancelHref = 'Household-AddPerson-' + T + '.dc.html'; v.confirmHref = viewH; }
    else if (k === 'discardSplit') { v.cancelHref = 'Splits-Changed-' + T + '.dc.html'; v.confirmHref = viewH; }
    else if (k === 'discardRooms') { v.cancelHref = 'LandlordRooms-Changed-' + T + '.dc.html'; v.confirmHref = viewH; }
    else if (k === 'removePersonIncluded') { v.cancelHref = 'Household-EditTenant1-' + T + '.dc.html'; v.confirmHref = viewH; }
    else { v.cancelHref = 'Household-EditPerson-' + T + '.dc.html'; v.confirmHref = viewH; }
    return v;
  }
}
