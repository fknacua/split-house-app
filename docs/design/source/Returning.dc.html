<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Returning user, loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 400px; height: 848px; box-sizing: border-box; padding: 8px; background: #0B0C0C; border-radius: 26px; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: {{c.onSurface}}">
<div style="position: relative; width: 384px; height: 832px; border-radius: 18px; overflow: hidden; background: {{c.background}}; display: flex; flex-direction: column">
<div style="position: absolute; top: 12px; left: 186px; width: 12px; height: 12px; border-radius: 6px; background: #050505; box-shadow: 0 0 0 2px #1C1D1E"></div>
<div style="height: 36px; flex-shrink: 0"></div>
<main style="flex-grow: 1; min-height: 0; padding: 0 24px; display: flex; flex-direction: column; justify-content: center; gap: 32px">
<section style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
<span style="width: 64px; height: 64px; border-radius: 20px; background: {{c.primary}}; color: {{c.onPrimary}}; display: flex; align-items: center; justify-content: center">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
</span>
<h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 800">Getting things ready</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; font-weight: 500; color: {{c.onSurfaceVariant}}">You’re signed in. Your household and bills are loading, and your reminders are being set up again on this phone.</p>
</section>

<!-- gluestack Card with a short checklist; no first-run setup for a returning user -->
<section aria-label="Progress" style="background: {{c.surface}}; border-radius: 20px; padding: 8px 16px; display: flex; flex-direction: column">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 14px; min-height: 56px; border-top: 1px solid {{s.divider}}">
<span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid {{s.ring}}; background: {{s.fill}}; color: {{s.fg}}">
<sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{s.busy}}" hint-placeholder-val="{{false}}"><!-- gluestack Spinner --><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9" opacity="0.25"></circle><path d="M21 12a9 9 0 0 0-9-9"></path></svg></sc-if>
</span>
<span style="font-size: 14px; line-height: 20px; font-weight: {{s.weight}}; color: {{s.text}}">{{s.label}}</span>
</div>
</sc-for>
</section>
</main>
<div style="height: 28px; flex-shrink: 0"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.theme === 'dark';
    var c = dark ? {
      background: '#111214', surface: '#1A1C1E', onSurface: '#E3E3E6', onSurfaceVariant: '#C4C6CB', outlineVariant: '#2E3134', outline: '#8E9196',
      primary: '#E2E2E6', onPrimary: '#1A1C1E', selected: '#2C2F33', success: '#66BB6A', successContainer: '#1B5E20', onSuccessContainer: '#CBE4CB'
    } : {
      background: '#F5F5F7', surface: '#FFFFFF', onSurface: '#1A1C1E', onSurfaceVariant: '#45484C', outlineVariant: '#E6E7EA', outline: '#74777C',
      primary: '#2B2F33', onPrimary: '#FFFFFF', selected: '#E6E7EA', success: '#2E7D32', successContainer: '#C8E6C9', onSuccessContainer: '#1E4620'
    };
    var steps = [
      { label: 'Signed in with Google', st: 'done' },
      { label: 'Loading your household and bills', st: 'busy' },
      { label: 'Setting up your reminders', st: 'wait' }
    ].map(function (s, i) {
      var done = s.st === 'done', busy = s.st === 'busy';
      return {
        label: s.label, done: done, busy: busy,
        divider: i === 0 ? 'transparent' : c.outlineVariant,
        ring: done ? c.successContainer : (busy ? c.primary : c.outlineVariant),
        fill: done ? c.successContainer : 'transparent',
        fg: done ? c.onSuccessContainer : c.primary,
        weight: s.st === 'wait' ? '500' : '700',
        text: s.st === 'wait' ? c.onSurfaceVariant : c.onSurface
      };
    });
    return { c: c, steps: steps };
  }
}
</script>
</body>
</html>
