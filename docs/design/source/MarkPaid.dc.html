<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mark paid / Record payment — sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
[data-field]:focus-within{border-color:currentColor !important;box-shadow:0 0 0 1px currentColor}
[data-field] input:focus{outline:none}
</style>
</helmet>
<div style="width: 400px; height: 848px; box-sizing: border-box; padding: 8px; background: #0B0C0C; border-radius: 26px; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; color: {{c.onSurface}}">
<div style="position: relative; width: 384px; height: 832px; border-radius: 18px; overflow: hidden; background: {{c.background}}">

<div aria-hidden="true" style="padding: 48px 16px 0; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 24px; line-height: 32px; font-weight: 800">November 2026</span>
<div style="height: 210px; border-radius: 24px; background: {{c.selected}}"></div>
<div style="height: 330px; border-radius: 20px; background: {{c.surface}}"></div>
</div>
<a href="{{backHref}}" aria-label="Close" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: {{c.scrim}}"></a>
<div style="position: absolute; top: 12px; left: 186px; width: 12px; height: 12px; border-radius: 6px; background: #050505; box-shadow: 0 0 0 2px #1C1D1E"></div>

<section role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-busy="{{busyAttr}}" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 784px; background: {{c.sheet}}; border-radius: 28px 28px 0 0; display: flex; flex-direction: column">
<div style="display: flex; justify-content: center; padding: 10px 0 4px"><span style="width: 32px; height: 4px; border-radius: 2px; background: {{c.track}}"></span></div>

<div style="overflow-y: auto; scrollbar-width: none; padding: 8px 16px 4px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 id="sheetTitle" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 800">{{title}}</h1>
<span style="font-size: 14px; line-height: 20px; font-weight: 500; color: {{c.onSurfaceVariant}}">{{subtitle}}</span>
</div>

<sc-if value="{{isRecord}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 16px">
<!-- FormControl + Select: From -->
<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<label id="fromLabel" style="font-size: 14px; line-height: 20px; font-weight: 700; color: {{c.onSurface}}">From<span aria-hidden="true" style="color: {{c.danger}}"> *</span></label>
<button data-field="" aria-haspopup="listbox" aria-expanded="{{menuAttr}}" aria-labelledby="fromLabel fromValue" onClick="{{toggleMenu}}" style="height: 48px; box-sizing: border-box; border-radius: 12px; background: {{fieldBg}}; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: {{c.primary}}; width: 100%; border: 1px solid {{fromBorder}}; box-shadow: {{fromShadow}}; font-family: inherit; text-align: left">
<span id="fromValue" style="flex-grow: 1; font-size: 16px; line-height: 24px; font-weight: 500; color: {{fieldFg}}">{{who}}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.onSurfaceVariant}}; transform: rotate({{chevRot}})"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<ul role="listbox" aria-label="From" style="position: absolute; top: 80px; left: 0; right: 0; z-index: 3; margin: 0; padding: 6px 0; list-style: none; background: {{c.surface}}; border: 1px solid {{c.outlineVariant}}; border-radius: 12px">
<sc-for list="{{people}}" as="pp" hint-placeholder-count="3">
<li role="option" aria-selected="{{pp.selAttr}}">
<button onClick="{{pp.pick}}" style="width: 100%; min-height: 56px; padding: 8px 16px; box-sizing: border-box; border: 0; background: {{pp.bg}}; color: {{c.onSurface}}; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: left">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 15px; line-height: 22px; font-weight: 700">{{pp.name}}</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.onSurfaceVariant}}">{{pp.detail}}</span>
</span>
<sc-if value="{{pp.sel}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
</button>
</li>
</sc-for>
</ul>
</sc-if>
</div>

<!-- FormControl + Select: For -->
<div style="position: relative; display: flex; flex-direction: column; gap: 6px">
<label id="forLabel" style="font-size: 14px; line-height: 20px; font-weight: 700; color: {{c.onSurface}}">For<span aria-hidden="true" style="color: {{c.danger}}"> *</span></label>
<button data-field="" aria-haspopup="listbox" aria-expanded="{{forAttr}}" aria-labelledby="forLabel forValue" onClick="{{toggleFor}}" style="height: 48px; box-sizing: border-box; border-radius: 12px; background: {{fieldBg}}; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: {{c.primary}}; width: 100%; border: 1px solid {{forBorder}}; box-shadow: {{forShadow}}; font-family: inherit; text-align: left">
<span id="forValue" style="flex-grow: 1; font-size: 16px; line-height: 24px; font-weight: 500; color: {{fieldFg}}">{{forLabel}}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.onSurfaceVariant}}; transform: rotate({{forRot}})"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<sc-if value="{{forOpen}}" hint-placeholder-val="{{false}}">
<ul role="listbox" aria-label="For" style="position: absolute; top: 80px; left: 0; right: 0; z-index: 3; margin: 0; padding: 6px 0; list-style: none; background: {{c.surface}}; border: 1px solid {{c.outlineVariant}}; border-radius: 12px">
<sc-for list="{{charges}}" as="cg" hint-placeholder-count="2">
<li role="option" aria-selected="{{cg.selAttr}}">
<button onClick="{{cg.pick}}" style="width: 100%; min-height: 56px; padding: 8px 16px; box-sizing: border-box; border: 0; background: {{cg.bg}}; color: {{c.onSurface}}; display: flex; align-items: center; gap: 12px; font-family: inherit; text-align: left">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px">
<span style="display: flex; justify-content: space-between; gap: 8px; font-size: 15px; line-height: 22px; font-weight: 700"><span>{{cg.label}}</span><span style="font-variant-numeric: tabular-nums">{{cg.exp}}</span></span>
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{cg.dueFg}}">{{cg.due}}</span>
</span>
<span style="width: 18px; flex-shrink: 0; display: flex">
<sc-if value="{{cg.sel}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
</span>
</button>
</li>
</sc-for>
</ul>
</sc-if>
</div>
</div>
</sc-if>

<div style="background: {{c.container}}; border: 1px solid {{c.outlineVariant}}; border-radius: 16px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.onSurfaceVariant}}">Expected</span>
<span style="font-size: 20px; line-height: 28px; font-weight: 800; font-variant-numeric: tabular-nums">{{expected}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end">
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.onSurfaceVariant}}">Due</span>
<span style="font-size: 14px; line-height: 20px; font-weight: 700; color: {{dueFg}}">{{due}}</span>
</div>
</div>

<!-- FormControl: Amount received -->
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="amt" style="font-size: 14px; line-height: 20px; font-weight: 700; color: {{c.onSurface}}">Amount received<span aria-hidden="true" style="color: {{c.danger}}"> *</span></label>
<div data-field="" style="height: 48px; box-sizing: border-box; border-radius: 12px; background: {{fieldBg}}; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: {{c.primary}}; border: 1px solid {{amtBorder}}; box-shadow: {{amtShadow}}">
<span style="font-size: 16px; line-height: 24px; font-weight: 500; color: {{c.onSurfaceVariant}}">$</span>
<input id="amt" inputmode="decimal" value="{{amount}}" placeholder="0.00" aria-readonly="{{busyAttr}}" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: Manrope, sans-serif; font-size: 16px; line-height: 24px; font-weight: 500; color: {{fieldFg}}; font-variant-numeric: tabular-nums">
</div>
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: {{c.onSurfaceVariant}}">{{amtHelper}}</span>
</div>

<!-- FormControl: Received on (date field) -->
<div style="display: flex; flex-direction: column; gap: 6px">
<label id="whenLabel" style="font-size: 14px; line-height: 20px; font-weight: 700; color: {{c.onSurface}}">Received on<span aria-hidden="true" style="color: {{c.danger}}"> *</span></label>
<button data-field="" aria-labelledby="whenLabel whenValue" style="height: 48px; box-sizing: border-box; border-radius: 12px; background: {{fieldBg}}; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: {{c.primary}}; width: 100%; border: 1px solid {{fieldBorder}}; font-family: inherit; text-align: left">
<span id="whenValue" style="flex-grow: 1; font-size: 16px; line-height: 24px; font-weight: 500; color: {{fieldFg}}">Today, Tue 3 Nov</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.onSurfaceVariant}}"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
</button>
</div>

<sc-if value="{{isDiff}}" hint-placeholder-val="{{false}}">
<!-- Alert (warning) containing the shortfall Radio group -->
<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 16px; background: {{c.warningTint}}; border: 1px solid {{c.warningLine}}">
<div role="alert" style="display: flex; gap: 10px; align-items: flex-start">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px; color: {{c.warning}}"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; line-height: 22px; font-weight: 800">$63.65 short</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{c.onSurfaceVariant}}">What should happen to the rest?</span>
</div>
</div>
<!-- Radio group -->
<div role="radiogroup" aria-label="Shortfall" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{choices}}" as="ch" hint-placeholder-count="2">
<button role="radio" aria-checked="{{ch.checked}}" onClick="{{ch.pick}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{ch.border}}; background: {{ch.bg}}; color: {{ch.fg}}; font-family: inherit; text-align: left">
<span style="position: relative; width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 10px; border: 2px solid {{ch.ring}}">
<span style="position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; border-radius: 5px; background: {{ch.dot}}"></span>
</span>
<span style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 14px; line-height: 20px; font-weight: 700">{{ch.title}}</span>
<span style="font-size: 12px; line-height: 16px; font-weight: 600; color: {{ch.sub}}">{{ch.detail}}</span>
</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
</div>

<footer style="padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px">
<sc-if value="{{isFailed}}" hint-placeholder-val="{{false}}">
<!-- Alert (danger): failed save -->
<div role="alert" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: {{c.dangerTint}}; border: 1px solid {{c.dangerLine}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: {{c.danger}}"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
<span style="font-size: 13px; line-height: 18px; font-weight: 700; color: {{c.onDangerTint}}">Couldn't save. Check your connection and try again.</span>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 4px">
<a href="{{backHref}}" aria-disabled="{{busyAttr}}" style="height: 48px; border-radius: 24px; background: {{btnBg}}; color: {{btnFg}}; pointer-events: {{btnEvents}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 700; text-decoration: none">
<sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{isSaving}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; flex-shrink: 0"></span></sc-if>
{{saveLabel}}
</a>
<a href="{{backHref}}" aria-disabled="{{busyAttr}}" style="height: 44px; border-radius: 22px; color: {{cancelFg}}; pointer-events: {{btnEvents}}; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 20px; font-weight: 700; text-decoration: none">Cancel</a>
</div>
</footer>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["full","different","record","recordOpen","recordForOpen"],"default":"full"},"save":{"editor":"enum","options":["idle","saving","failed"],"default":"idle"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":400,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.theme === 'dark';
    var st = this.props.state || 'full';
    var self = this;
    var save = this.props.save || 'idle';
    var saving = save === 'saving';
    var failed = save === 'failed';
    var c = dark ? {
      background: '#111214', surface: '#1A1C1E', container: '#222427', sheet: '#222427',
      onSurface: '#E3E3E6', onSurfaceVariant: '#C4C6CB', outline: '#8E9196', outlineVariant: '#2E3134',
      primary: '#E2E2E6', onPrimary: '#1A1C1E', selected: '#2C2F33', onSelected: '#E3E3E6',
      disabledBg: '#222427', disabledFg: '#5C5F64', track: '#3A3E43', scrim: 'rgba(0,0,0,0.6)',
      warning: '#FFA726', warningTint: '#332108', warningLine: '#F57C00',
      danger: '#F44336', dangerTint: '#3B1511', dangerLine: '#D32F2F', onDangerTint: '#FFD9D6'
    } : {
      background: '#F5F5F7', surface: '#FFFFFF', container: '#E9EAED', sheet: '#FFFFFF',
      onSurface: '#1A1C1E', onSurfaceVariant: '#45484C', outline: '#74777C', outlineVariant: '#E6E7EA',
      primary: '#2B2F33', onPrimary: '#FFFFFF', selected: '#E6E7EA', onSelected: '#1A1C1E',
      disabledBg: '#E9EAED', disabledFg: '#9A9DA2', track: '#D3D5D9', scrim: 'rgba(0,0,0,0.5)',
      warning: '#E65100', warningTint: '#FFF4E5', warningLine: '#FBE2CC',
      danger: '#D32F2F', dangerTint: '#FDEDED', dangerLine: '#F6D5D5', onDangerTint: '#5F2120'
    };
    var fieldBg = saving ? c.disabledBg : c.surface;
    var fieldBorder = saving ? c.outlineVariant : c.outline;
    var fieldFg = saving ? c.disabledFg : c.onSurface;
    var diff = st === 'different';
    var rec = st === 'record' || st === 'recordOpen' || st === 'recordForOpen';
    // Record payment: same sheet, plus From (dropdown) and For pickers
    var P = {
      'Tenant 2': { detail: '2 unpaid · $1,050.79', charges: [
        { label: 'Rent · Nov', amt: '950.00', exp: '$950.00', due: 'Overdue since 1 Nov', late: true },
        { label: 'Utilities · Nov', amt: '100.79', exp: '$100.79', due: 'Due Wed 4 Nov' } ] },
      'Primary Tenant': { detail: '1 unpaid · $1,963.65', charges: [
        { label: 'Primary Tenant + Tenant 1’s share · Nov', amt: '1,963.65', exp: '$1,963.65', due: 'Due Sat 7 Nov' } ] },
      'Tenant 1': { detail: '1 upcoming · $950.00', charges: [
        { label: 'Rent · Nov', amt: '950.00', exp: '$950.00', due: 'Due Sat 28 Nov' } ] }
    };
    var ss = this.state || {};
    var who = ss.who || 'Tenant 2';
    var menuOpen = ss.menu === undefined ? st === 'recordOpen' : ss.menu;
    var forOpen = ss.forMenu === undefined ? st === 'recordForOpen' : ss.forMenu;
    var ci = (ss.ci || 0) % P[who].charges.length;
    var ch = P[who].charges[ci];
    var charges = P[who].charges.map(function (x, i) {
      var on = i === ci;
      return { label: x.label, exp: x.exp, due: x.due, dueFg: x.late ? c.danger : c.onSurfaceVariant, sel: on, selAttr: on ? 'true' : 'false', bg: on ? c.selected : 'transparent',
        pick: function () { self.setState({ ci: i, forMenu: false }); } };
    });
    var people = ['Tenant 2', 'Primary Tenant', 'Tenant 1'].map(function (n) {
      var on = n === who;
      return { name: n, detail: P[n].detail, sel: on, selAttr: on ? 'true' : 'false', bg: on ? c.selected : 'transparent',
        pick: function () { self.setState({ who: n, menu: false, forMenu: false, ci: 0 }); } };
    });
    var pick = (this.state && this.state.pick) || 'carry';
    var raw = [
      { id: 'carry', title: 'Carry $63.65 to December', detail: 'Added to their December breakdown as “Unpaid from Nov”' },
      { id: 'drop', title: 'Let it go', detail: 'November counts as settled. You cover the $63.65' }
    ];
    var choices = raw.map(function (r) {
      var on = r.id === pick;
      return {
        title: r.title, detail: r.detail, checked: on ? 'true' : 'false',
        border: on ? c.primary : c.outline, bg: on ? c.selected : 'transparent',
        ring: on ? c.primary : c.outline, dot: on ? c.primary : 'transparent',
        pick: function () { self.setState({ pick: r.id }); }
      };
    });
    return {
      c: c, fieldBg: fieldBg, fieldBorder: fieldBorder, fieldFg: fieldFg, busyAttr: saving ? 'true' : 'false',
      isSaving: saving, isFailed: failed, isIdle: !saving && !failed, btnEvents: saving ? 'none' : 'auto',
      btnBg: saving ? c.disabledBg : c.primary, btnFg: saving ? c.disabledFg : c.onPrimary, cancelFg: saving ? c.disabledFg : c.primary,
      isDiff: diff, choices: choices, isRecord: rec,
      title: rec ? 'Record payment' : 'Mark paid',
      subtitle: rec ? 'Money you received for November' : 'Primary Tenant + Tenant 1’s share · November',
      who: who, people: people, menuOpen: rec && menuOpen, menuAttr: menuOpen ? 'true' : 'false',
      chevRot: menuOpen ? '180deg' : '0deg',
      fromBorder: menuOpen ? c.primary : fieldBorder, fromShadow: menuOpen ? '0 0 0 1px ' + c.primary : 'none',
      toggleMenu: function () { self.setState({ menu: !menuOpen, forMenu: false }); },
      forLabel: ch.label, charges: charges, forOpen: rec && forOpen, forAttr: forOpen ? 'true' : 'false',
      forRot: forOpen ? '180deg' : '0deg',
      forBorder: forOpen ? c.primary : fieldBorder, forShadow: forOpen ? '0 0 0 1px ' + c.primary : 'none',
      toggleFor: function () { self.setState({ forMenu: !forOpen, menu: false }); },
      expected: rec ? ch.exp : '$1,963.65',
      due: rec ? ch.due.replace(/^Due /, '') : 'Sat 7 Nov',
      dueFg: rec && ch.late ? c.danger : c.onSurface,
      amount: diff ? '1,900.00' : (rec ? ch.amt : '1,963.65'),
      amtBorder: diff && !saving ? c.primary : fieldBorder, amtShadow: diff && !saving ? '0 0 0 1px ' + c.primary : 'none',
      amtHelper: diff ? 'Expected $1,963.65' : 'Change it if they paid a different amount',
      saveLabel: failed ? 'Retry' : diff ? 'Save $1,900.00' : (rec ? 'Record $' + ch.amt : 'Mark as paid'),
      backHref: dark ? 'Home-Overdue-Dark.dc.html' : 'Home-Overdue-Light.dc.html'
    };
  }
}
</script>
</body>
</html>
